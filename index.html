<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="header"><h2>Expense Tracker</h2></div>
        <br>
        <div id="show">
             <div id="rupees">
                <label  style=color:white for="first">₹</label>
                <input  type="number" id="first" value="0" placeholder="0">
             </div>
             <div id="your"><h2>Your balance</h2></div>
             
             
        </div>
        <br>
        <div id="box1">
            <h3>Transactions  </h3>
            <hr>
        
        </div>
        <br>
        <div id="written"></div>
        <div id="footer">
            <div id="up"><h3>Add Transaction</h3></div>
            <div id="down1">
                <div id="one">
                    <label for="TEXT">Text</label>
                    <input type="text" id="TEXT" placeholder="Enter text" required>
                </div>
                <div id="two">
                    <label for="AMOUNT">Amount</label>
                    <input type="number" id="AMOUNT"   placeholder="Enter amount" required>
                </div>
            </div>
            <div id="down2">
                <div id="three">
                    <h3 style="text-align: center;">Savings</h3>
                    <button id="button1" >Rs.0</button>
                </div>
                <div id="fourth">
                    <h3 style="text-align: center;">Expenses</h3>
                    <button id="button2">Rs.0</button>
                </div>
            </div>

                
              
            </div>
        </div>
    </div>









    <script src="script.js"></script>
</body>
</html>
